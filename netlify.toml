[build]
  functions = "netlify/functions"
  publish   = "."

# ── Headers ───────────────────────────────────────────────────────────────────
# Prevent protected pages from being indexed or cached.
# Client-side auth.js enforces the session check on every page load.
[[headers]]
  for = "/protected/*"
  [headers.values]
    X-Robots-Tag  = "noindex, nofollow"
    Cache-Control = "no-store"
